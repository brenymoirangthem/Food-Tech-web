<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Dashboard - FoodTech Platform</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#dc2626">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #fef2f2; }
        .dashboard { height: 100vh; display: flex; flex-direction: column; }
        .header { background: #dc2626; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 20px; }
        .logout-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 350px; height: calc(100vh - 60px); }
        .map-section { position: relative; }
        #map { width: 100%; height: 100%; }
        .view-toggle { position: absolute; top: 20px; right: 20px; z-index: 1001; }
        .toggle-btn { background: white; border: 2px solid #dc2626; color: #dc2626; padding: 8px 12px; border-radius: 20px; cursor: pointer; font-size: 12px; margin-left: 5px; }
        .toggle-btn.active { background: #dc2626; color: white; }
        .map-view .sidebar { display: none; }
        .map-view .map-section { grid-column: 1 / -1; }
        .list-view .map-section { display: none; }
        .list-view .sidebar { grid-column: 1 / -1; border-left: none; }
        .sidebar { background: white; padding: 20px; overflow-y: auto; border-left: 1px solid #e5e7eb; }
        .emergency-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 25px; }
        .emergency-btn { background: #dc2626; color: white; border: none; padding: 12px 8px; border-radius: 8px; cursor: pointer; font-size: 12px; }
        .emergency-btn.secondary { background: #f59e0b; }
        .centers-list h3 { font-size: 16px; margin-bottom: 15px; color: #dc2626; }
        .center-card { background: #fef2f2; padding: 15px; border-radius: 12px; margin-bottom: 12px; border-left: 4px solid #dc2626; }
        .center-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
        .center-details { font-size: 12px; color: #666; margin-bottom: 8px; }
        .center-status { display: flex; justify-content: space-between; align-items: center; }
        .status-badge { padding: 2px 8px; border-radius: 12px; font-size: 10px; font-weight: 600; }
        .status-active { background: #10b981; color: white; }
        .status-busy { background: #f59e0b; color: white; }
        .status-offline { background: #ef4444; color: white; }
        @media (max-width: 768px) {
            .dashboard-grid { 
                grid-template-columns: 1fr; 
                grid-template-rows: auto 1fr; 
            }
            .sidebar { 
                border-left: none; 
                border-top: 1px solid #e5e7eb;
                max-height: calc(100vh - 120px);
                padding: 15px;
            }
            #map { height: calc(100vh - 120px); }
            .view-toggle { top: 70px; right: 10px; }
            .toggle-btn { padding: 6px 10px; font-size: 11px; }
            .emergency-actions { grid-template-columns: 1fr; gap: 8px; }
            .emergency-btn { padding: 10px 6px; font-size: 11px; }
            .header { flex-wrap: wrap; gap: 10px; padding: 12px 15px; }
            .header h1 { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <header class="header">
            <div style="display: flex; align-items: center; gap: 15px;">
                <button onclick="window.location.href='dashboard.html'" style="background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 12px; border-radius: 8px; cursor: pointer;">🏠 Dashboard</button>
                <h1>🚨 Emergency Dashboard</h1>
            </div>
            <div style="background: rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 4px; font-size: 11px;">Crisis Mode</div>
            <button onclick="logout()" class="logout-btn">Logout</button>
        </header>

        <div class="dashboard-grid">
            <div class="map-section">
                <div class="view-toggle">
                    <button class="toggle-btn active" onclick="switchView('map')">🗺️ Map</button>
                    <button class="toggle-btn" onclick="switchView('list')">📋 List</button>
                </div>
                <div id="map"></div>
            </div>

            <div class="sidebar">
                <div class="emergency-actions">
                    <button class="emergency-btn" onclick="broadcastAlert()">📢 Broadcast Alert</button>
                    <button class="emergency-btn" onclick="coordinateResponse()">🚁 Coordinate Response</button>
                    <button class="emergency-btn secondary" onclick="trackSupplies()">📦 Track Supplies</button>
                    <button class="emergency-btn secondary" onclick="manageEvacuation()">🚪 Manage Evacuation</button>
                </div>

                <div style="background: #fef2f2; border: 1px solid #dc2626; border-radius: 8px; padding: 12px; margin-bottom: 20px; font-size: 12px; color: #7f1d1d;">
                    <strong>🚨 Emergency Mode Active</strong><br>
                    • Real-time crisis coordination<br>
                    • Direct communication with all centers<br>
                    • Emergency supply distribution<br>
                    • Evacuation route management
                </div>

                <div class="centers-list">
                    <h3>Emergency Distribution Points</h3>
                    <div id="centers-container"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map, markers = [], userLocation = null;

        function checkAuth() {
            const user = localStorage.getItem('foodtech_user');
            if (!user) {
                window.location.href = 'login.html';
                return false;
            }
            return true;
        }
        
        function logout() {
            localStorage.removeItem('foodtech_user');
            localStorage.removeItem('foodtech_session');
            localStorage.removeItem('foodtech_token');
            alert('✅ Logged out successfully');
            window.location.href = 'login.html';
        }

        const emergencyPoints = [
            {
                id: 1,
                name: "Imphal Emergency Center",
                address: "Thangal Bazar, Imphal West",
                lat: 24.8170,
                lng: 93.9368,
                status: "active",
                capacity: "500 people",
                supplies: ["Emergency Rations", "Water", "Medical Supplies"],
                contact: "+91 9876543210"
            },
            {
                id: 2,
                name: "Moirang Relief Station",
                address: "Moirang Bazar, Bishnupur",
                lat: 24.5167,
                lng: 93.7667,
                status: "active",
                capacity: "300 people",
                supplies: ["Food Packets", "Blankets", "First Aid"],
                contact: "+91 9876543211"
            },
            {
                id: 3,
                name: "Thoubal Evacuation Point",
                address: "Thoubal Bazar, Thoubal",
                lat: 24.6340,
                lng: 93.9856,
                status: "busy",
                capacity: "200 people",
                supplies: ["Basic Supplies", "Water", "Shelter"],
                contact: "+91 9876543212"
            }
        ];

        document.addEventListener('DOMContentLoaded', function() {
            if (!checkAuth()) return;
            
            setTimeout(() => {
                initMap();
                loadEmergencyPoints();
            }, 100);
        });

        function initMap() {
            map = L.map('map').setView([24.8170, 93.9368], 11);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
            
            console.log('Emergency map initialized');
        }

        function loadEmergencyPoints() {
            renderEmergencyPoints();
            addMapMarkers();
        }

        function renderEmergencyPoints() {
            const container = document.getElementById('centers-container');
            container.innerHTML = '';

            emergencyPoints.forEach(point => {
                const pointElement = document.createElement('div');
                pointElement.className = 'center-card';
                pointElement.innerHTML = `
                    <div class="center-name">${point.name}</div>
                    <div class="center-details">${point.address}</div>
                    <div class="center-details">📞 ${point.contact}</div>
                    <div class="center-details">👥 Capacity: ${point.capacity}</div>
                    <div class="center-details">📦 ${point.supplies.join(', ')}</div>
                    <div class="center-status">
                        <span class="status-badge status-${point.status}">${point.status.toUpperCase()}</span>
                        <button onclick="contactPoint('${point.name}')" style="background: #dc2626; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 10px; cursor: pointer;">📞 Contact</button>
                    </div>
                `;
                
                pointElement.onclick = () => {
                    map.setView([point.lat, point.lng], 15);
                };
                
                container.appendChild(pointElement);
            });
        }

        function addMapMarkers() {
            markers.forEach(marker => map.removeLayer(marker));
            markers = [];

            emergencyPoints.forEach(point => {
                const marker = L.marker([point.lat, point.lng], {
                    icon: L.divIcon({
                        html: '🚨',
                        iconSize: [25, 25],
                        className: 'emergency-marker'
                    })
                }).addTo(map);

                marker.bindPopup(`
                    <div style="min-width: 200px;">
                        <h4>🚨 ${point.name}</h4>
                        <p><strong>Address:</strong> ${point.address}</p>
                        <p><strong>Status:</strong> <span style="color: ${point.status === 'active' ? '#10b981' : '#f59e0b'}">${point.status.toUpperCase()}</span></p>
                        <p><strong>Capacity:</strong> ${point.capacity}</p>
                        <p><strong>Supplies:</strong> ${point.supplies.join(', ')}</p>
                        <button onclick="contactPoint('${point.name}')" style="background: #dc2626; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; margin-top: 8px;">📞 Emergency Contact</button>
                    </div>
                `);

                markers.push(marker);
            });
        }

        function switchView(view) {
            const dashboard = document.querySelector('.dashboard-grid');
            const mapBtn = document.querySelector('.toggle-btn[onclick="switchView(\\'map\\')"]');
            const listBtn = document.querySelector('.toggle-btn[onclick="switchView(\\'list\\')"]');
            
            if (view === 'map') {
                dashboard.className = 'dashboard-grid map-view';
                mapBtn.classList.add('active');
                listBtn.classList.remove('active');
                setTimeout(() => {
                    if (map) map.invalidateSize();
                }, 100);
            } else {
                dashboard.className = 'dashboard-grid list-view';
                listBtn.classList.add('active');
                mapBtn.classList.remove('active');
            }
        }

        function broadcastAlert() {
            const message = prompt('Enter emergency broadcast message:');
            if (message) {
                alert(`🚨 EMERGENCY BROADCAST SENT\\n\\nMessage: "${message}"\\n\\nSent to all emergency points and registered users.`);
            }
        }

        function coordinateResponse() {
            alert('🚁 RESPONSE COORDINATION\\n\\n• Emergency teams dispatched\\n• Medical units on standby\\n• Evacuation routes activated\\n• Supply chains mobilized');
        }

        function trackSupplies() {
            alert('📦 SUPPLY TRACKING\\n\\nCurrent Emergency Supplies:\\n• Food Rations: 85% available\\n• Water: 92% available\\n• Medical: 78% available\\n• Shelter: 67% available\\n\\nSupply trucks en route to low-stock areas.');
        }

        function manageEvacuation() {
            alert('🚪 EVACUATION MANAGEMENT\\n\\n• Safe routes identified\\n• Transportation arranged\\n• Shelter capacity confirmed\\n• Medical support ready\\n\\nEvacuation can proceed when needed.');
        }

        function contactPoint(pointName) {
            alert(`📞 EMERGENCY CONTACT\\n\\nConnecting to: ${pointName}\\n\\nDirect emergency line established.\\nCoordination channel active.`);
        }
    </script>
</body>
</html>
