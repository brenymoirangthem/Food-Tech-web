<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Dashboard - FoodTechMap Manipur</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #ffffff; overflow: hidden; }
        .dashboard { height: 100vh; display: flex; flex-direction: column; }
        .dashboard-header { background: #d32f2f; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .dashboard-header h1 { font-size: 20px; font-weight: 600; }
        .crisis-status { display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .status-indicator { width: 10px; height: 10px; border-radius: 50%; background: #4caf50; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 350px; height: calc(100vh - 70px); }
        .map-container { position: relative; background: #2a2a2a; }
        #emergency-map { width: 100%; height: 100%; }
        .map-controls { position: absolute; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 1000; }
        .control-btn { width: 45px; height: 45px; background: rgba(0,0,0,0.8); border: none; border-radius: 8px; color: white; cursor: pointer; }
        .info-panel { background: #2a2a2a; padding: 20px; overflow-y: auto; border-left: 1px solid #444; }
        .stats-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-bottom: 25px; }
        .stat-card { background: #333; padding: 15px; border-radius: 12px; display: flex; align-items: center; gap: 15px; border-left: 4px solid; }
        .stat-card.urgent { border-left-color: #f44336; }
        .stat-card.active { border-left-color: #4caf50; }
        .stat-card.supply { border-left-color: #ff9800; }
        .stat-card h3 { font-size: 24px; font-weight: 700; }
        .stat-card p { font-size: 12px; opacity: 0.7; margin-top: 2px; }
        .distribution-list { margin-bottom: 25px; }
        .distribution-list h3 { font-size: 16px; margin-bottom: 15px; color: #4caf50; }
        .distribution-point { background: #333; padding: 12px; border-radius: 8px; margin-bottom: 10px; border-left: 3px solid #4caf50; cursor: pointer; }
        .point-name { font-weight: 600; font-size: 14px; }
        .point-details { font-size: 12px; opacity: 0.7; margin-top: 4px; }
        .point-status { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
        .status-badge { padding: 2px 8px; border-radius: 12px; font-size: 10px; font-weight: 600; }
        .status-badge.verified { background: #4caf50; color: white; }
        .status-badge.limited { background: #ff9800; color: white; }
        .emergency-actions { display: flex; flex-direction: column; gap: 12px; }
        .action-btn { padding: 12px 16px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .action-btn.primary { background: #d32f2f; color: white; }
        .action-btn.secondary { background: #444; color: white; }
    </style>
</head>
<body>
    <div class="dashboard">
        <header class="dashboard-header">
            <div style="display: flex; align-items: center; gap: 15px;">
                <button onclick="window.location.href='dashboard.html'" style="background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 12px; border-radius: 8px; cursor: pointer;">🏠 Dashboard</button>
                <h1>🚨 Emergency Food Distribution - Manipur</h1>
            </div>
            <div class="crisis-status">
                <span class="status-indicator"></span>
                <span>Emergency Mode Active</span>
                <button onclick="logout()" style="background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 12px; border-radius: 8px; cursor: pointer; margin-left: 15px;">Logout</button>
            </div>
        </header>

        <div class="dashboard-grid">
            <div class="map-container">
                <div id="emergency-map"></div>
                <div class="map-controls">
                    <button class="control-btn" onclick="locateUser()">📍</button>
                    <button class="control-btn" onclick="toggleView()">🗺️</button>
                </div>
            </div>

            <div class="info-panel">
                <div class="stats-grid">
                    <div class="stat-card urgent">
                        <span style="font-size: 28px;">⚠️</span>
                        <div>
                            <h3 id="urgent-requests">8</h3>
                            <p>Urgent Requests</p>
                        </div>
                    </div>
                    <div class="stat-card active">
                        <span style="font-size: 28px;">🏪</span>
                        <div>
                            <h3 id="active-centers">5</h3>
                            <p>Active Centers</p>
                        </div>
                    </div>
                    <div class="stat-card supply">
                        <span style="font-size: 28px;">📦</span>
                        <div>
                            <h3 id="total-supply">72%</h3>
                            <p>Supply Level</p>
                        </div>
                    </div>
                </div>

                <div class="distribution-list">
                    <h3>Emergency Distribution Points</h3>
                    <div id="distribution-points"></div>
                </div>

                <div class="emergency-actions">
                    <button class="action-btn primary" onclick="reportEmergency()">
                        🚨 Report Emergency
                    </button>
                    <button class="action-btn secondary" onclick="requestSupplies()">
                        🚚 Request Supplies
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // UNIFIED AUTH - Same format as login.html
        function checkAuth() {
            const user = localStorage.getItem('foodtech_user');
            if (!user) {
                window.location.href = 'login.html';
                return false;
            }
            try {
                const userData = JSON.parse(user);
                return userData.sessionToken ? true : false;
            } catch (e) {
                localStorage.removeItem('foodtech_user');
                window.location.href = 'login.html';
                return false;
            }
        }
        
        function logout() {
            localStorage.removeItem('foodtech_user');
            localStorage.removeItem('foodtech_session');
            localStorage.removeItem('foodtech_token');
            alert('✅ Logged out successfully');
            window.location.href = 'login.html';
        }
    </script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map;
        let userLocation;
        let distributionPoints = [];
        let markers = [];

        // Emergency distribution points in Manipur valley areas only
        const manipurEmergencyPoints = [
            {
                id: 1,
                name: "Manipur State Emergency Center",
                address: "Secretariat Complex, Imphal",
                lat: 24.8170,
                lng: 93.9368,
                status: "verified",
                capacity: 2000,
                currentSupply: 1650,
                supplies: ["Emergency Rations", "Water", "Medical Supplies", "Blankets"],
                contact: "Emergency Control Room: 100"
            },
            {
                id: 2,
                name: "District Emergency Hub - Imphal East",
                address: "DC Office Complex, Porompat",
                lat: 24.8067,
                lng: 93.9449,
                status: "verified",
                capacity: 1000,
                currentSupply: 780,
                supplies: ["Food Packets", "Water", "First Aid", "Shelter Materials"],
                contact: "District Emergency: +91 385 244 2233"
            },
            {
                id: 3,
                name: "Thoubal Emergency Relief",
                address: "Thoubal District HQ",
                lat: 24.6340,
                lng: 93.9856,
                status: "limited",
                capacity: 500,
                currentSupply: 120,
                supplies: ["Basic Food", "Water Purification", "Emergency Kits"],
                contact: "Thoubal Emergency: +91 385 242 1100"
            },
            {
                id: 4,
                name: "Bishnupur Relief Station",
                address: "Bishnupur District Center",
                lat: 24.6167,
                lng: 93.7833,
                status: "verified",
                capacity: 600,
                currentSupply: 480,
                supplies: ["Community Kitchen", "Water", "Medical Aid", "Temporary Shelter"],
                contact: "Bishnupur Emergency: +91 385 243 0099"
            },
            {
                id: 5,
                name: "Kakching Emergency Base",
                address: "Kakching Town Emergency Center",
                lat: 24.4983,
                lng: 93.9817,
                status: "verified",
                capacity: 400,
                currentSupply: 320,
                supplies: ["Hot Meals", "Emergency Supplies", "Communication"],
                contact: "Kakching Emergency: +91 385 247 1122"
            }
        ];

        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
            initMap();
            loadDistributionPoints();
            startRealTimeUpdates();
        });

        function initMap() {
            // Initialize map centered on Manipur
            map = L.map('emergency-map').setView([24.8170, 93.9368], 9);
            
            // Dark theme tiles for emergency mode
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '© OpenStreetMap contributors, © CARTO'
            }).addTo(map);
            
            // Don't auto-locate on init, wait for user to click locate button
            console.log('Emergency map initialized - Click locate button to get your position');
        }

        function loadDistributionPoints() {
            distributionPoints = manipurEmergencyPoints;
            renderDistributionPoints();
            updateMapMarkers();
            updateStats();
        }

        function renderDistributionPoints() {
            const container = document.getElementById('distribution-points');
            container.innerHTML = '';

            distributionPoints.forEach(point => {
                const supplyPercentage = Math.round((point.currentSupply / point.capacity) * 100);
                const statusClass = point.status === 'verified' ? 'verified' : 'limited';
                
                const pointElement = document.createElement('div');
                pointElement.className = 'distribution-point';
                pointElement.innerHTML = `
                    <div class="point-name">${point.name}</div>
                    <div class="point-details">${point.address}</div>
                    <div class="point-details">${point.contact}</div>
                    <div class="point-details">📦 ${point.supplies.join(', ')}</div>
                    <div class="point-status">
                        <span class="status-badge ${statusClass}">${point.status.toUpperCase()}</span>
                        <span style="font-size: 12px;">${supplyPercentage}% capacity</span>
                    </div>
                    <div style="font-size: 10px; color: #94a3b8; margin-top: 4px; font-style: italic;">Capacity estimated from supply data</div>
                `;
                
                pointElement.addEventListener('click', () => {
                    map.setView([point.lat, point.lng], 13);
                });
                
                container.appendChild(pointElement);
            });
        }

        function updateMapMarkers() {
            markers.forEach(marker => map.removeLayer(marker));
            markers = [];

            distributionPoints.forEach(point => {
                const supplyLevel = (point.currentSupply / point.capacity);
                let markerIcon = '🟢'; // Green for good supply
                
                if (supplyLevel < 0.3) markerIcon = '🔴'; // Red for low supply
                else if (supplyLevel < 0.6) markerIcon = '🟡'; // Yellow for medium supply

                const marker = L.marker([point.lat, point.lng], {
                    icon: L.divIcon({
                        html: markerIcon,
                        iconSize: [25, 25],
                        className: 'emergency-marker'
                    })
                }).addTo(map);

                marker.bindPopup(`
                    <div style="color: #333; padding: 10px; min-width: 200px;">
                        <h3>${point.name}</h3>
                        <p><strong>Status:</strong> ${point.status.toUpperCase()}</p>
                        <p><strong>Capacity:</strong> ${point.currentSupply}/${point.capacity}</p>
                        <p><strong>Contact:</strong> ${point.contact}</p>
                        <p><strong>Available:</strong> ${point.supplies.join(', ')}</p>
                        <button onclick="requestDirections(${point.lat}, ${point.lng})" 
                                style="background: #d32f2f; color: white; border: none; padding: 8px 16px; border-radius: 4px; margin-top: 8px; cursor: pointer;">
                            🛡️ Safe Emergency Route
                        </button>
                        <div style="font-size: 10px; color: #ccc; margin-top: 4px;">Opens in external maps with security waypoints</div>
                    </div>
                `);

                markers.push(marker);
            });
        }

        function updateStats() {
            const urgentRequests = Math.floor(Math.random() * 15) + 3;
            const activeCenters = distributionPoints.filter(p => p.status === 'verified').length;
            const totalSupply = Math.round(
                distributionPoints.reduce((sum, point) => sum + (point.currentSupply / point.capacity), 0) / 
                distributionPoints.length * 100
            );

            document.getElementById('urgent-requests').textContent = urgentRequests;
            document.getElementById('active-centers').textContent = activeCenters;
            document.getElementById('total-supply').textContent = totalSupply + '%';
        }

        function startRealTimeUpdates() {
            setInterval(() => {
                updateStats();
                // Simulate supply changes
                distributionPoints.forEach(point => {
                    const change = Math.random() * 8 - 4;
                    point.currentSupply = Math.max(0, Math.min(point.capacity, point.currentSupply + change));
                });
                renderDistributionPoints();
            }, 30000);
        }

        function locateUser() {
            if (!navigator.geolocation) {
                alert('❌ Geolocation not supported by this browser.');
                return;
            }
            
            alert('📍 Getting your location for emergency coordination...');
            
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    userLocation = [position.coords.latitude, position.coords.longitude];
                    
                    // Clear existing user markers
                    map.eachLayer(function(layer) {
                        if (layer.options && layer.options.className && layer.options.className.includes('user-marker')) {
                            map.removeLayer(layer);
                        }
                    });
                    
                    // Add new user marker
                    L.marker(userLocation, {
                        icon: L.divIcon({
                            html: '🔴',
                            iconSize: [25, 25],
                            className: 'user-marker'
                        })
                    }).addTo(map).bindPopup(`Your Emergency Location<br>Lat: ${position.coords.latitude.toFixed(4)}<br>Lng: ${position.coords.longitude.toFixed(4)}`);
                    
                    map.setView(userLocation, 12);
                    alert(`✅ Location updated!\n\nCoordinates: ${position.coords.latitude.toFixed(4)}, ${position.coords.longitude.toFixed(4)}\n\nAccuracy: ±${Math.round(position.coords.accuracy)}m`);
                },
                function(error) {
                    let errorMsg = 'Location access failed: ';
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            errorMsg += 'Permission denied. Please allow location access for emergency services.';
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMsg += 'Location information unavailable.';
                            break;
                        case error.TIMEOUT:
                            errorMsg += 'Location request timed out.';
                            break;
                    }
                    alert('❌ ' + errorMsg);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                }
            );
        }

        function toggleView() {
            const currentTiles = map.hasLayer(map._layers[Object.keys(map._layers)[0]]);
            
            if (confirm('Switch map view?\n\nOK = Satellite View\nCancel = Street View')) {
                // Switch to satellite view
                map.eachLayer(function(layer) {
                    if (layer._url && layer._url.includes('cartocdn')) {
                        map.removeLayer(layer);
                    }
                });
                
                L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                    attribution: '© Esri, Maxar, GeoEye, Earthstar Geographics, CNES/Airbus DS, USDA, USGS, AeroGRID, IGN, and the GIS User Community'
                }).addTo(map);
                
                alert('✅ Switched to satellite view for better emergency coordination');
            } else {
                // Switch back to dark street view
                map.eachLayer(function(layer) {
                    if (layer._url && layer._url.includes('arcgisonline')) {
                        map.removeLayer(layer);
                    }
                });
                
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                    attribution: '© OpenStreetMap contributors, © CARTO'
                }).addTo(map);
                
                alert('✅ Switched to street view for emergency operations');
            }
        }

        async function reportEmergency() {
            const location = prompt("Emergency location:");
            const description = prompt("Describe the emergency situation:");
            const urgencyLevel = prompt("Urgency level (low/medium/high/critical):");
            
            if (!description || !location) {
                alert('❌ Emergency report cancelled. Location and description are required.');
                return;
            }
            
            const emergencyData = {
                location: location,
                description: description,
                urgency: urgencyLevel || 'medium'
            };
            
            try {
                const token = localStorage.getItem('foodtech_token');
                const headers = { 'Content-Type': 'application/json' };
                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                }
                
                const response = await fetch('http://localhost:5000/api/emergency-reports', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(emergencyData)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    alert(`🚨 EMERGENCY REPORTED 🚨\n\nLocation: ${location}\nSituation: ${description}\nUrgency: ${urgencyLevel}\n\n✅ Emergency services alerted\n✅ Report ID: ${data.report_id}\n✅ Timestamp: ${new Date(data.timestamp).toLocaleString()}`);
                } else {
                    throw new Error('API Error');
                }
            } catch (error) {
                // Fallback to local storage for offline mode
                const reportId = 'EMG-' + Date.now();
                alert(`🚨 EMERGENCY REPORTED (OFFLINE) 🚨\n\nLocation: ${location}\nSituation: ${description}\nUrgency: ${urgencyLevel}\n\n✅ Report saved locally\n✅ Report ID: ${reportId}\n⚠️ Will sync when online`);
                
                // Store locally for later sync
                const localReports = JSON.parse(localStorage.getItem('emergency_reports') || '[]');
                localReports.push({
                    id: reportId,
                    location: location,
                    description: description,
                    urgency: urgencyLevel,
                    timestamp: new Date().toISOString(),
                    synced: false
                });
                localStorage.setItem('emergency_reports', JSON.stringify(localReports));
            }
        }

        function requestSupplies() {
            const supplies = prompt("Emergency supplies needed in Manipur:");
            const quantity = prompt("Number of people needing assistance:");
            const district = prompt("Which district in Manipur:");
            
            if (supplies && quantity) {
                alert(`📦 SUPPLY REQUEST FOR MANIPUR 📦\n\nSupplies: ${supplies}\nFor: ${quantity} people\nDistrict: ${district || 'Not specified'}\n\n✅ Request sent to Manipur Emergency Control\n✅ Local distribution centers alerted\n✅ State relief coordination activated`);
                
                console.log('Manipur Supply Request:', {
                    supplies,
                    quantity,
                    district,
                    location: userLocation,
                    timestamp: new Date(),
                    state: 'Manipur'
                });
            }
        }

        function requestDirections(lat, lng) {
            if (userLocation) {
                // Show safe route options for emergency
                const safeRouteConfirm = confirm('🚨 EMERGENCY ROUTE OPTIONS \n\nOK = Safe Emergency Route (recommended)\nCancel = Direct Route');
                
                if (safeRouteConfirm) {
                    // Safe emergency route with security waypoints
                    const securityWaypoint = 24.8100; // Via security checkpoint
                    const securityWaypointLng = 93.9400;
                    const url = `https://www.openstreetmap.org/directions?engine=fossgis_osrm_car&route=${userLocation[0]}%2C${userLocation[1]}%3B${securityWaypoint}%2C${securityWaypointLng}%3B${lat}%2C${lng}`;
                    window.open(url, '_blank');
                    alert('🛡️ SAFE EMERGENCY ROUTE ACTIVATED\n\n✅ Route via security checkpoints\n✅ Avoiding conflict zones\n✅ Emergency services notified\n✅ Real-time safety monitoring');
                } else {
                    // Direct emergency route
                    const url = `https://www.openstreetmap.org/directions?from=${userLocation[0]},${userLocation[1]}&to=${lat},${lng}`;
                    window.open(url, '_blank');
                    alert('⚠️ Direct route selected. Please exercise caution.');
                }
            } else {
                alert('Please allow location access for emergency routing.');
            }
        }
    </script>
</body>
</html>
